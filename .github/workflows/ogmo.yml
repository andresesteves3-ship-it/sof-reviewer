name: Robô do OGMO
on:
  schedule:
    - cron: '22 * * * *'     # a cada hora (minuto 22)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ogmo
  cancel-in-progress: false
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # v0.84.1: o robô roda dentro do pacote pronto do Playwright (navegador e peças do sistema já instalados).
      # A versão da imagem tem de ser a mesma do "playwright" no package.json (1.49.1).
      - name: Ler (dentro do Playwright pronto)
        env:
          OGMO_EMPRESA: ${{ secrets.OGMO_EMPRESA }}
          OGMO_USER: ${{ secrets.OGMO_USER }}
          OGMO_PASS: ${{ secrets.OGMO_PASS }}
          LINEUP_KEY: ${{ secrets.LINEUP_KEY }}
        run: |
          docker run --rm --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e OGMO_EMPRESA -e OGMO_USER -e OGMO_PASS -e LINEUP_KEY \
            -v "$GITHUB_WORKSPACE":/w -w /w \
            mcr.microsoft.com/playwright:v1.49.1-noble \
            bash -c "npm install --no-audit --no-fund && node scripts/ogmo.js"
      - name: Salvar dados
        run: |
          git config user.name "robo-ogmo"
          git config user.email "robo-ogmo@users.noreply.github.com"
          git add -A dados
          if git diff --cached --quiet; then echo "Nada para salvar"; else
            git commit -m "OGMO: atualização automática"
            # outro robô pode ter publicado ao mesmo tempo: tenta de novo até 5 vezes
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push recusado, tentando de novo ($i)"; sleep $((i*7))
            done
            if [ "$ok" != 1 ]; then echo "::error::Não consegui publicar os dados depois de 5 tentativas"; exit 1; fi
          fi
