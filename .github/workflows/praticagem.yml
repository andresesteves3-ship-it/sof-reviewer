name: Robô da Praticagem
on:
  schedule:
    # v0.102.1: 1 rodada por hora (minuto 7) com 4 leituras, 15 min entre elas.
    # O GitHub atrasa as rodadas agendadas (a cada 15 min dava, na prática, de 30 a 80 min); dentro da rodada o intervalo é certo.
    - cron: '7 * * * *'
  workflow_dispatch:          # "Rodar agora" (painel ou GitHub): 1 leitura só
permissions:
  contents: write
concurrency:
  group: praticagem-${{ github.event_name }}   # o "Rodar agora" não espera a rodada agendada terminar
  cancel-in-progress: false
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Ler e salvar (4 vezes na rodada agendada)
        run: |
          git config user.name "robo-praticagem"
          git config user.email "robo-praticagem@users.noreply.github.com"
          n=1; [ "${{ github.event_name }}" = "schedule" ] && n=4
          for v in $(seq 1 $n); do
            # pega o que os outros robôs publicaram (e a leitura do "Rodar agora") antes de ler
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort 2>/dev/null || true
            node scripts/praticagem.js || echo "::warning::leitura $v falhou"
            git add dados/praticagem.json dados/praticagem-status.json
            if git diff --cached --quiet; then echo "Leitura $v: nada para salvar"; else
              git commit -m "Praticagem: atualização automática"
              ok=0
              for i in 1 2 3 4 5; do
                if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
                git rebase --abort 2>/dev/null || true
                echo "push recusado, tentando de novo ($i)"; sleep $((i*7))
              done
              [ "$ok" != 1 ] && echo "::error::Leitura $v: não consegui publicar depois de 5 tentativas"
            fi
            [ "$v" -lt "$n" ] && sleep 840
          done
          exit 0
