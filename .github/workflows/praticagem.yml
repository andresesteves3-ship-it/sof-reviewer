name: Robô da Praticagem
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: praticagem
  cancel-in-progress: false
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/praticagem.js
      - name: Salvar dados
        run: |
          git config user.name "robo-praticagem"
          git config user.email "robo-praticagem@users.noreply.github.com"
          git add dados/praticagem.json
          if git diff --cached --quiet; then echo "Nada para salvar"; else
            git commit -m "Praticagem: atualização automática"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
