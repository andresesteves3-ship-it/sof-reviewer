name: Robô da Praticagem
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # a cada 15 minutos, fora dos horários redondos (o GitHub atrasa/pula mais em :00/:15/:30/:45); o painel aberto chama o robô se ele ficar parado
  workflow_dispatch:          # permite rodar na hora pelo botão "Run workflow"
permissions:
  contents: write
concurrency:
  group: praticagem
  cancel-in-progress: false
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/praticagem.js
      - name: Salvar dados
        run: |
          git config user.name "robo-praticagem"
          git config user.email "robo-praticagem@users.noreply.github.com"
          git add dados/praticagem.json dados/praticagem-status.json
          if git diff --cached --quiet; then echo "Nada para salvar"; else
            git commit -m "Praticagem: atualização automática"
            # outro robô pode ter publicado ao mesmo tempo: tenta de novo até 5 vezes
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push recusado, tentando de novo ($i)"; sleep $((i*7))
            done
            if [ "$ok" != 1 ]; then echo "::error::Não consegui publicar os dados depois de 5 tentativas"; exit 1; fi
          fi
