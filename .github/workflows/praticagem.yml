name: Robô da Praticagem
on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos (o GitHub às vezes atrasa ou pula; quanto mais leituras, menos manobra perdida)
  workflow_dispatch:          # permite rodar na hora pelo botão "Run workflow"
permissions:
  contents: write
concurrency:
  group: praticagem
  cancel-in-progress: false
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/praticagem.js
      - name: Salvar dados
        run: |
          git config user.name "robo-praticagem"
          git config user.email "robo-praticagem@users.noreply.github.com"
          git add dados/praticagem.json
          if git diff --cached --quiet; then echo "Nada para salvar"; else
            git commit -m "Praticagem: atualização automática"
            # outro robô pode ter publicado ao mesmo tempo: tenta de novo até 5 vezes
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              echo "push recusado, tentando de novo ($i)"; sleep $((i*7))
            done
          fi
