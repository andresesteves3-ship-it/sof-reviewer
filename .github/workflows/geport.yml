name: Robô do Geport
on:
  schedule:
    - cron: '37 * * * *'     # a cada hora (minuto 37)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geport
  cancel-in-progress: false
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.49.1
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node scripts/geport.js
        env:
          GEPORT_USER: ${{ secrets.GEPORT_USER }}
          GEPORT_PASS: ${{ secrets.GEPORT_PASS }}
          LINEUP_KEY: ${{ secrets.LINEUP_KEY }}
      - name: Salvar dados
        run: |
          git config user.name "robo-geport"
          git config user.email "robo-geport@users.noreply.github.com"
          git add dados/geport-status.json
          if [ -f dados/geport.enc.json ]; then git add dados/geport.enc.json; fi
          if git diff --cached --quiet; then echo "Nada para salvar"; else
            git commit -m "Geport: atualização automática"
            # outro robô pode ter publicado ao mesmo tempo: tenta de novo até 5 vezes
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push recusado, tentando de novo ($i)"; sleep $((i*7))
            done
            if [ "$ok" != 1 ]; then echo "::error::Não consegui publicar os dados depois de 5 tentativas"; exit 1; fi
          fi
